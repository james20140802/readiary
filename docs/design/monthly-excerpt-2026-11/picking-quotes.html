<style>
.rd{--paper:244 240 232;--ink:34 30 26;--sub:107 100 90;--faint:158 150 138;--rule:224 217 204;--rule2:207 197 180;--accent:45 95 184;--sheet:251 250 246;--slip-a:.66;--edge:rgb(255 255 255/.6);--shadow:0 1px 1px rgb(60 45 25/.05),0 10px 22px -18px rgb(60 45 25/.32);--serif:"Maru Buri","MaruBuri","AppleMyungjo","Nanum Myeongjo",serif;--sans:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif}
@media (prefers-color-scheme:dark){.rd{--paper:26 23 20;--ink:236 229 218;--sub:177 168 153;--faint:142 132 118;--rule:46 42 37;--rule2:74 64 54;--accent:133 169 236;--sheet:38 35 31;--slip-a:.72;--edge:rgb(255 255 255/.08);--shadow:0 14px 28px -18px rgb(0 0 0/.7)}}
.rd{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin:18px 0 8px}
.rd figure{margin:0;min-width:0}
.rd figcaption{font:600 14px/1.5 var(--sans);margin-bottom:8px}
.rd figcaption small{display:block;font-weight:400;opacity:.72;font-size:13px}
.rd .ph{position:relative;height:610px;overflow:hidden;background-color:rgb(var(--paper));color:rgb(var(--ink));border:1px solid rgb(var(--rule));border-radius:14px;padding:16px 16px 0;font-family:var(--sans)}
.rd .bar{display:flex;justify-content:space-between;font:600 15px var(--sans);padding-bottom:10px}
.rd .bar span:last-child{font-weight:500;color:rgb(var(--sub))}
.rd h4{font:700 20px/1.4 var(--serif);margin:0}
.rd .cap{font:500 13px/1.5 var(--sans);color:rgb(var(--sub));margin:2px 0 12px}
.rd .chips{display:flex;gap:6px;overflow:hidden;margin-bottom:6px}
.rd .chip{flex:none;font:600 13px var(--sans);padding:7px 12px;border-radius:99px;box-shadow:inset 0 0 0 1px rgb(var(--rule2));color:rgb(var(--sub))}
.rd .chip.on{background:rgb(var(--ink));color:rgb(var(--paper));box-shadow:none}
.rd .q-row{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 0;border-top:1px solid rgb(var(--rule))}
.rd .box{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgb(var(--rule2));display:grid;place-items:center;font:700 13px var(--sans);color:rgb(var(--paper));margin-top:2px}
.rd .box.on{background:rgb(var(--accent));box-shadow:none}
.rd .qt{font:500 16px/1.55 var(--serif);word-break:keep-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rd .src{font:500 12px/1.5 var(--sans);color:rgb(var(--faint));margin-top:4px}
.rd .tray{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 14px;background:rgb(var(--paper));border-top:1px solid rgb(var(--rule2));display:flex;justify-content:space-between;align-items:center;font:600 14px var(--sans)}
.rd .tray .seen{color:rgb(var(--accent));text-decoration:underline;text-underline-offset:3px}
.rd .btn{background:rgb(var(--ink));color:rgb(var(--paper));border-radius:99px;padding:10px 16px;font:600 14px var(--sans)}
.rd .btn.line{background:none;color:rgb(var(--ink));box-shadow:inset 0 0 0 1px rgb(var(--rule2))}
.rd .pos{display:flex;justify-content:space-between;font:500 13px var(--sans);color:rgb(var(--sub));margin:6px 0 10px}
.rd .pile{position:relative;height:320px;margin:0 10px 22px 0}
.rd .slip{position:absolute;inset:0;background-color:rgb(var(--sheet)/var(--slip-a));-webkit-backdrop-filter:blur(1.6px) saturate(.8);backdrop-filter:blur(1.6px) saturate(.8);box-shadow:inset 0 0 0 1px var(--edge),var(--shadow);border-radius:2px;padding:20px 18px 14px;display:flex;flex-direction:column}
.rd .s3{transform:translate(9px,8px) rotate(1.2deg)}
.rd .s2{transform:translate(5px,4px) rotate(-.6deg)}
.rd .slip .from{font:600 13px var(--serif);color:rgb(var(--sub));padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid rgb(var(--rule))}
.rd .slip .big{font:600 18px/1.65 var(--serif);word-break:keep-all}
.rd .slip .dt{margin-top:auto;font:500 12px var(--sans);color:rgb(var(--faint));display:flex;justify-content:space-between}
.rd .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.rd .ord{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:11px 0;border-top:1px solid rgb(var(--rule))}
.rd .ord .n{font:600 13px var(--sans);color:rgb(var(--sub))}
.rd .ord .ud{font:600 16px var(--sans);color:rgb(var(--sub));letter-spacing:8px}
.rd .ord .qt{-webkit-line-clamp:1;font-size:15px}
.rd .opt{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgb(var(--rule));padding:12px 0;font:600 14px var(--sans)}
.rd .opt span:last-child{color:rgb(var(--sub));font-weight:500}
.rd .note{font-size:13px;margin-top:6px;opacity:.72;line-height:1.5}
</style>

<h2>문장이 많은 달, 어떻게 고를까요?</h2>
<p class="subtitle">3월에 문장 38개를 남긴 경우입니다. 문장은 예시이고, A·B는 첫 단계만 다릅니다.</p>

<div class="rd">
  <figure>
    <figcaption>A. 책으로 좁혀 고르는 목록 (추천)<small>훑고 체크. 긴 문장은 세 줄까지 보이고, 고른 수는 아래에 항상 보임</small></figcaption>
    <div class="ph">
      <div class="bar"><span>3월 엮기</span><span>1/3 고르기</span></div>
      <h4>3월의 문장 38개</h4>
      <div class="cap">다시 읽고 싶은 문장만 골라 주세요</div>
      <div class="chips"><span class="chip on">전체 38</span><span class="chip">왜 나는 너를… 14</span><span class="chip">아무튼, 메모 12</span><span class="chip">계절의 끝 9</span></div>
      <div class="q-row"><span class="box on">✓</span><div><div class="qt">끝은 대개 처음에 이미 적혀 있다.</div><div class="src">왜 나는 너를 사랑하는가 · 3월 2일 · 생각 있음</div></div></div>
      <div class="q-row"><span class="box"></span><div><div class="qt">오늘 읽은 문장은 내일의 내가 다시 쓰게 될지도 모른다.</div><div class="src">아무튼, 메모 · 3월 4일</div></div></div>
      <div class="q-row"><span class="box on">✓</span><div><div class="qt">메모는 나를 위해 남겨 두는 작은 신호다. 그 신호를 언제 다시 받게 될지는 모르지만, 받는 날에는 그 메모를 적던 나와 잠시 만나게 된다. 그래서 적는 일은 언제나 조금 먼 곳으로 보내는 편지에 가깝다.</div><div class="src">아무튼, 메모 · 3월 9일</div></div></div>
      <div class="q-row"><span class="box"></span><div><div class="qt">계절은 문장보다 늦게 도착한다.</div><div class="src">계절의 끝 · 3월 11일</div></div></div>
      <div class="tray"><span class="seen">고른 문장 5</span><span class="btn">순서 정하기</span></div>
    </div>
    <p class="note">많은 문장을 빠르게 훑을 수 있고, 키보드와 화면 낭독기로 다루기도 쉽습니다.</p>
  </figure>

  <figure>
    <figcaption>B. 한 장씩 넘기며 담기<small>간지를 한 장씩 보고 담거나 넘김</small></figcaption>
    <div class="ph">
      <div class="bar"><span>3월 엮기</span><span>1/3 고르기</span></div>
      <h4>3월의 문장 38개</h4>
      <div class="pos"><span>7 / 38</span><span>담은 문장 5</span></div>
      <div class="pile">
        <div class="slip s3"></div><div class="slip s2"></div>
        <div class="slip"><div class="from">왜 나는 너를 사랑하는가</div><div class="big">사랑에 빠지는 일은 상대를 다 알기 전에 시작된다.</div><div class="dt"><span>p.88</span><span>3월 14일</span></div></div>
      </div>
      <div class="two"><span class="btn line">넘기기</span><span class="btn">담기</span></div>
    </div>
    <p class="note">한 문장씩 다시 읽는 맛은 크지만, 38개면 끝까지 가기 벅찹니다.</p>
  </figure>

  <figure>
    <figcaption>그다음: 순서와 미리보기 (공통)<small>끌어서 옮기거나 위·아래 버튼으로 순서 변경</small></figcaption>
    <div class="ph">
      <div class="bar"><span>3월 엮기</span><span>2/3 순서</span></div>
      <h4>어떤 순서로 읽을까요</h4>
      <div class="cap">첫 문장이 친구 피드의 표지가 돼요</div>
      <div class="ord"><span class="n">1</span><div class="qt">끝은 대개 처음에 이미 적혀 있다.</div><span class="ud">↑↓</span></div>
      <div class="ord"><span class="n">2</span><div class="qt">메모는 나를 위해 남겨 두는 작은 신호다.</div><span class="ud">↑↓</span></div>
      <div class="ord"><span class="n">3</span><div class="qt">사랑에 빠지는 일은 상대를 다 알기 전에 시작된다.</div><span class="ud">↑↓</span></div>
      <div class="ord"><span class="n">4</span><div class="qt">겨울의 문장은 천천히 마른다.</div><span class="ud">↑↓</span></div>
      <div class="ord"><span class="n">5</span><div class="qt">같은 문장을 두 번 만났다.</div><span class="ud">↑↓</span></div>
      <div class="tray"><span class="seen">문장 다시 고르기</span><span class="btn">미리보기</span></div>
    </div>
    <p class="note">3단계 미리보기에서 묶음과 펼친 페이지를 보고 엮기를 마칩니다.</p>
  </figure>
</div>

<div class="options">
  <div class="option" data-choice="filtered-list" onclick="toggleSelect(this)"><div class="letter">A</div><div class="content"><h3>책으로 좁혀 고르는 목록 (추천)</h3><p>문장이 많아도 빠르고, 고른 문장을 언제든 다시 볼 수 있습니다.</p></div></div>
  <div class="option" data-choice="pile-pick" onclick="toggleSelect(this)"><div class="letter">B</div><div class="content"><h3>한 장씩 넘기며 담기</h3><p>문장을 다시 만나는 시간은 길어지지만 많은 달에는 오래 걸립니다.</p></div></div>
