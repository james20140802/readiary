<style>
.rd{--paper:244 240 232;--ink:34 30 26;--sub:107 100 90;--faint:158 150 138;--rule:224 217 204;--accent:45 95 184;--sheet:251 250 246;--slip-a:.66;--edge:rgb(255 255 255/.6);--shadow:0 1px 1px rgb(60 45 25/.05),0 10px 22px -18px rgb(60 45 25/.32);--serif:"Maru Buri","MaruBuri","AppleMyungjo","Nanum Myeongjo",serif;--sans:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif}
@media (prefers-color-scheme:dark){.rd{--paper:26 23 20;--ink:236 229 218;--sub:177 168 153;--faint:142 132 118;--rule:46 42 37;--accent:133 169 236;--sheet:38 35 31;--slip-a:.72;--edge:rgb(255 255 255/.08);--shadow:0 14px 28px -18px rgb(0 0 0/.7)}}
.rd{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin:18px 0 8px}
.rd figure{margin:0;min-width:0}
.rd figcaption{font:600 14px/1.5 var(--sans);margin-bottom:8px}
.rd figcaption small{display:block;font-weight:400;opacity:.72;font-size:13px}
.rd .ph{min-height:390px;background-color:rgb(var(--paper));color:rgb(var(--ink));border:1px solid rgb(var(--rule));border-radius:14px;padding:16px 16px 20px;font-family:var(--sans);background-image:linear-gradient(transparent 39px,rgb(var(--rule)/.7) 39px,rgb(var(--rule)/.7) 40px);background-size:100% 40px}
.rd .bar{font:600 15px var(--sans);padding-bottom:14px}
.rd h4{font:700 19px/1.4 var(--serif);margin:0 0 4px}
.rd .cap{font:500 13px/1.5 var(--sans);color:rgb(var(--sub));margin-bottom:10px}
.rd .slip{background-color:rgb(var(--sheet)/var(--slip-a));-webkit-backdrop-filter:blur(1.6px) saturate(.8);backdrop-filter:blur(1.6px) saturate(.8);box-shadow:inset 0 0 0 1px var(--edge),var(--shadow);border-radius:2px;padding:16px 16px 14px}
.rd .slip .big{font:600 18px/1.55 var(--serif);word-break:keep-all}
.rd .slip .small{font:500 13px/1.6 var(--sans);color:rgb(var(--sub));margin-top:6px}
.rd .acts{display:flex;align-items:center;gap:14px;margin-top:12px;font:600 14px var(--sans)}
.rd .btn{background:rgb(var(--ink));color:rgb(var(--paper));border-radius:99px;padding:9px 16px}
.rd .later{color:rgb(var(--sub));font-weight:500}
.rd .dim{opacity:.5;margin-top:18px}
.rd .dim .big{font:500 16px/1.5 var(--serif)}
.rd .row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:baseline;border-top:1px solid rgb(var(--rule));padding:10px 0}
.rd .row b{font:600 14px var(--sans)}
.rd .row .t{font:400 15px/1.45 var(--serif);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rd .row .t.quiet{color:rgb(var(--faint))}
.rd .row .go{font:600 14px var(--sans);color:rgb(var(--accent))}
.rd .row .go.mk{color:rgb(var(--ink));text-decoration:underline;text-underline-offset:3px}
.rd .more{font:600 14px var(--sans);color:rgb(var(--accent));margin-top:8px}
.rd .tabs{display:flex;gap:18px;font:600 14px var(--sans);color:rgb(var(--sub));margin-bottom:14px}
.rd .tabs b{color:rgb(var(--ink));border-bottom:2px solid rgb(var(--ink));padding-bottom:2px}
.rd .bookrow{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border-top:1px solid rgb(var(--rule));padding:9px 0;font:600 15px var(--serif)}
.rd .cov{width:36px;height:50px;background:rgb(var(--rule));border-radius:2px}
.rd .bookrow span:last-child{color:rgb(var(--accent));font:600 14px var(--sans)}
.rd .yr{display:flex;justify-content:space-between;font:600 14px var(--sans);margin:14px 0 2px}
.rd .yr span{color:rgb(var(--sub));font-weight:500}
.rd .yrbar{display:flex;justify-content:space-between;align-items:center;font:600 16px var(--sans);margin-bottom:12px}
.rd .yrbar i{font-style:normal;color:rgb(var(--sub));padding:0 8px}
.rd .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rd .m{min-height:64px;padding:9px 10px;border-radius:2px;font:600 14px var(--sans);display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px rgb(var(--rule))}
.rd .m small{font:500 12px var(--sans);color:rgb(var(--sub))}
.rd .m.made{background-color:rgb(var(--sheet)/var(--slip-a));box-shadow:inset 0 0 0 1px var(--edge),var(--shadow)}
.rd .m.made small{color:rgb(var(--accent));font-weight:600}
.rd .m.open small{color:rgb(var(--ink));text-decoration:underline;text-underline-offset:2px;font-weight:600}
.rd .m.none{color:rgb(var(--faint));box-shadow:none;opacity:.8}
.rd .m.none small{color:rgb(var(--faint))}
.rd .note{font-size:13px;margin-top:6px;opacity:.72;line-height:1.5}
</style>

<h2>어디서 시작하고, 쌓이면 어떻게 찾을까요?</h2>
<p class="subtitle">추천안이에요. 프로필의 달 목록을 집으로 삼고, 오늘과 책장은 그곳으로 이어집니다. 시점은 4월 3일, 문장은 예시입니다.</p>

<div class="rd">
  <figure>
    <figcaption>① 오늘: 달이 바뀌면 조용한 안내<small>엮거나 '다음에'를 누르면 그 달에는 다시 뜨지 않음</small></figcaption>
    <div class="ph">
      <div class="bar">오늘</div>
      <div class="slip">
        <div class="big">3월을 엮어 볼까요?</div>
        <div class="small">네 권의 책에서 문장 서른여덟 개를 남겼어요.</div>
        <div class="acts"><span class="btn">문장 고르기</span><span class="later">다음에</span></div>
      </div>
      <div class="dim"><div class="big">오늘 마음에 남은 문장</div></div>
    </div>
  </figure>

  <figure>
    <figcaption>② 프로필: 언제든 시작하는 집<small>기존 '달마다 남긴 문장' 줄에 '엮기' 또는 '펼치기'를 더함</small></figcaption>
    <div class="ph">
      <div class="bar">프로필</div>
      <h4>달마다 남긴 문장</h4>
      <div class="cap">끝난 달부터 엮을 수 있어요</div>
      <div class="row"><b>4월</b><span class="t">메모는 나를 위해 남겨 두는 작은 신호다.</span><span></span></div>
      <div class="row"><b>3월</b><span class="t">끝은 대개 처음에 이미 적혀 있다.</span><span class="go mk">엮기</span></div>
      <div class="row"><b>2월</b><span class="t">읽지 못한 책도 나를 조금 바꾼다.</span><span class="go">펼치기</span></div>
      <div class="more">달의 발췌집 모두 보기</div>
    </div>
  </figure>

  <figure>
    <figcaption>③ 책장: 같은 곳으로 가는 한 줄<small>'다 읽은 책' 위에 놓고, 눌러서 모아 보기로 이동</small></figcaption>
    <div class="ph">
      <div class="bar">내 책장</div>
      <div class="row" style="grid-template-columns:1fr auto;border-top:0"><span class="t" style="font-weight:600">달의 발췌집 <span style="color:rgb(var(--sub));font:500 13px var(--sans)">14권</span></span><span class="go">모두 보기</span></div>
      <h4 style="margin-top:14px">다 읽은 책</h4>
      <div class="cap">3권 · 발췌집으로 묶였어요</div>
      <div class="bookrow"><span class="cov"></span><span>왜 나는 너를 사랑하는가</span><span>발췌집</span></div>
      <div class="bookrow"><span class="cov"></span><span>아무튼, 메모</span><span>발췌집</span></div>
    </div>
  </figure>
</div>

<h3 style="margin-top:26px">달이 많이 쌓였을 때, 모아 보기는 어떤 모양이 좋을까요?</h3>
<div class="rd">
  <figure>
    <figcaption>A. 해마다 접는 목록 (추천)<small>문장이 보여서 다시 읽고 싶어짐. 올해만 펼치고 지난해는 접음</small></figcaption>
    <div class="ph">
      <div class="bar">달의 발췌집</div>
      <div class="yr">2026년 <span>2권</span></div>
      <div class="row"><b>3월</b><span class="t quiet">아직 엮지 않았어요</span><span class="go mk">엮기</span></div>
      <div class="row"><b>2월</b><span class="t">읽지 못한 책도 나를 조금 바꾼다.</span><span class="go">펼치기</span></div>
      <div class="row"><b>1월</b><span class="t">겨울의 문장은 천천히 마른다.</span><span class="go">펼치기</span></div>
      <div class="yr" style="border-top:1px solid rgb(var(--rule));padding-top:12px">2025년 <span>9권 · 펼치기</span></div>
      <div class="yr" style="border-top:1px solid rgb(var(--rule));padding-top:12px">2024년 <span>3권 · 펼치기</span></div>
    </div>
    <p class="note">친구 서재에는 엮은 달만 보입니다.</p>
  </figure>

  <figure>
    <figcaption>B. 한 해씩 넘기는 12칸<small>기록 꺼내기의 달 선택과 비슷함. 찾기 빠르지만 문장은 안 보임</small></figcaption>
    <div class="ph">
      <div class="bar">달의 발췌집</div>
      <div class="yrbar"><i>‹</i>2026년<i>›</i></div>
      <div class="grid">
        <div class="m made">1월<small>펼치기</small></div>
        <div class="m made">2월<small>펼치기</small></div>
        <div class="m open">3월<small>엮기</small></div>
        <div class="m none">4월<small>진행 중</small></div>
        <div class="m none">5월</div><div class="m none">6월</div>
        <div class="m none">7월</div><div class="m none">8월</div>
        <div class="m none">9월</div>
      </div>
    </div>
    <p class="note">친구 서재에는 엮은 달만 눌립니다.</p>
  </figure>
</div>

<div class="options">
  <div class="option" data-choice="yearly-list" onclick="toggleSelect(this)"><div class="letter">A</div><div class="content"><h3>해마다 접는 목록 (추천)</h3><p>찾는 일보다 다시 만나는 일에 맞습니다.</p></div></div>
  <div class="option" data-choice="year-grid" onclick="toggleSelect(this)"><div class="letter">B</div><div class="content"><h3>한 해씩 넘기는 12칸</h3><p>몇 년이 쌓여도 특정 달로 빠르게 갑니다.</p></div></div>
</div>
