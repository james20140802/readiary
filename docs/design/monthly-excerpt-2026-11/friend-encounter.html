<style>
.rd{--paper:#F4F0E8;--ink:#221E1A;--sub:#6B645A;--faint:#9E968A;--rule:#E0D9CC;--rule2:#CFC5B4;--accent:#2D5FB8;--sheet:#FBFAF6;--margin:#8EA9DD;--serif:"Maru Buri","MaruBuri","AppleMyungjo","Nanum Myeongjo",serif;--sans:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif}
@media (prefers-color-scheme:dark){.rd{--paper:#1A1714;--ink:#ECE5DA;--sub:#B1A899;--faint:#8E8476;--rule:#2E2A25;--rule2:#4A4036;--accent:#85A9EC;--sheet:#26231F;--margin:#4F6694}}
.rd{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin:20px 0 8px}
.rd figure{margin:0;min-width:0}
.rd figcaption{font:600 14px/1.5 var(--sans);color:inherit;margin-bottom:8px}
.rd figcaption small{display:block;font-weight:400;opacity:.72;font-size:13px}
.rd .ph{background:var(--paper);color:var(--ink);border:1px solid var(--rule2);border-radius:14px;padding:16px 16px 18px;min-height:520px;overflow:hidden;font-family:var(--sans);background-image:repeating-linear-gradient(transparent 0 33px,var(--rule) 33px 34px)}
.rd .bar{display:flex;justify-content:space-between;font:600 15px var(--sans);padding-bottom:12px}
.rd .bar span:last-child{color:var(--sub);font-weight:500}
.rd .who{font:500 14px var(--sans);color:var(--sub);margin:4px 0 10px}
.rd .who b{color:var(--ink);font-weight:600}
.rd .pile{position:relative;margin:0 8px 18px 0}
.rd .pile:before,.rd .pile:after{content:"";position:absolute;inset:0;background:var(--sheet);border:1px solid var(--rule2);border-radius:3px}
.rd .pile:before{transform:translate(9px,9px) rotate(1.2deg)}
.rd .pile:after{transform:translate(5px,5px) rotate(-.6deg)}
.rd .slip{position:relative;z-index:1;background:var(--sheet);border:1px solid var(--rule2);border-radius:3px;padding:20px 18px 14px;box-shadow:0 8px 18px rgba(50,40,25,.08)}
.rd .k{font:600 12px var(--sans);letter-spacing:.14em;color:var(--sub)}
.rd .ttl{font:700 22px/1.35 var(--serif);margin-top:8px}
.rd .q{font:600 18px/1.65 var(--serif);margin-top:14px;word-break:keep-all}
.rd .src{font:500 13px var(--sans);color:var(--faint);margin-top:12px}
.rd .meta{font:500 13px var(--sans);color:var(--sub);margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.rd .open{color:var(--accent);font-weight:600;font-size:14px}
.rd .acts{display:flex;gap:16px;font:500 13px var(--sans);color:var(--sub);padding:4px 2px}
.rd .ghost{border-top:1px solid var(--rule);margin-top:14px;padding-top:14px;opacity:.55}
.rd .ghost .q{font-size:16px;margin-top:0}
.rd .tp{text-align:center;padding:12px 0 16px}
.rd .tp .ttl{font-size:26px}
.rd .tp p{font:400 15px/1.7 var(--serif);color:var(--sub);margin:12px 0 0;word-break:keep-all}
.rd .pos{display:flex;justify-content:space-between;font:500 13px var(--sans);color:var(--sub);margin-bottom:8px}
.rd .pos span:last-child{color:var(--accent);font-weight:600}
.rd .card{aspect-ratio:4/5;max-height:300px;display:flex;flex-direction:column}
.rd .card .q{margin-top:0}
.rd .card .src{margin-top:auto}
.rd .sec{font:700 17px var(--serif);margin:6px 0 10px}
.rd .yr{font:600 13px var(--sans);color:var(--sub);margin:16px 0 2px}
.rd .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid var(--rule);padding:11px 0}
.rd .row b{display:block;font:600 16px var(--serif)}
.rd .row small{display:block;font:500 13px var(--sans);color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd .row>span:last-child{color:var(--accent);font:600 14px var(--sans)}
.rd .row>span:first-child{min-width:0}
</style>

<h2>친구는 내 3월 발췌집을 어디서 만날까요?</h2>
<p class="subtitle">추천안의 흐름이에요. 왼쪽에서 오른쪽 순서로 보세요. 문장과 이름은 예시입니다.</p>

<div class="rd">
  <figure>
    <figcaption>① 소셜: 엮은 날 한 번만 소식으로<small>평소 문장 소식과 같은 자리, 간지가 쌓인 모양으로 구분</small></figcaption>
    <div class="ph">
      <div class="bar"><span>소셜</span><span>친구</span></div>
      <div class="who"><b>민지</b>님이 발췌집을 엮었어요 · 4월 1일</div>
      <div class="pile"><div class="slip">
        <div class="k">달의 발췌집</div>
        <div class="ttl">2026년 3월</div>
        <div class="q">끝은 대개 처음에 이미 적혀 있다.</div>
        <div class="src">왜 나는 너를 사랑하는가</div>
        <div class="meta"><span>문장 12 · 책 4권</span><span class="open">펼치기</span></div>
      </div></div>
      <div class="acts"><span>♡ 8</span><span>댓글 3</span></div>
      <div class="ghost">
        <div class="who"><b>서준</b>님의 문장 · 어제</div>
        <div class="q">메모는 나를 위해 남겨 두는 작은 신호다.</div>
      </div>
    </div>
  </figure>

  <figure>
    <figcaption>② 펼치면: 표제지와 간지 묶음<small>책별 발췌집과 같은 읽기, 장마다 어느 책인지 표시</small></figcaption>
    <div class="ph">
      <div class="tp">
        <div class="k">달의 발췌집</div>
        <div class="ttl">2026년 3월</div>
        <p>민지가 네 권의 책에서<br>문장 열두 개를 골랐습니다.</p>
      </div>
      <div class="pos"><span>3 / 12</span><span>한 줄로 펼치기</span></div>
      <div class="pile"><div class="slip card">
        <div class="q">사랑에 빠지는 일은 상대를 다 알기 전에 시작된다.</div>
        <div class="src">왜 나는 너를 사랑하는가 · 알랭 드 보통 · 3월 14일</div>
      </div></div>
    </div>
  </figure>

  <figure>
    <figcaption>③ 그 뒤로는: 서재에 달마다 놓임<small>소식이 지나가도 친구 서재와 내 프로필에서 다시 찾기</small></figcaption>
    <div class="ph">
      <div class="bar"><span>민지의 서재</span><span>친구</span></div>
      <div class="sec">달마다 엮은 발췌집</div>
      <div class="yr">2026년</div>
      <div class="row"><span><b>3월</b><small>끝은 대개 처음에 이미 적혀 있다.</small></span><span>펼치기</span></div>
      <div class="row"><span><b>2월</b><small>읽지 못한 책도 나를 조금 바꾼다.</small></span><span>펼치기</span></div>
      <div class="row"><span><b>1월</b><small>겨울의 문장은 천천히 마른다.</small></span><span>펼치기</span></div>
      <div class="yr">2025년 · 9권</div>
      <div class="row"><span><b>12월</b><small>한 해의 끝에도 페이지는 남는다.</small></span><span>펼치기</span></div>
      <div class="row"><span><b>11월</b><small>같은 문장을 두 번 만났다.</small></span><span>펼치기</span></div>
    </div>
  </figure>
</div>

<h3 style="margin-top:24px">소셜에는 어떻게 놓을까요?</h3>
<div class="options">
  <div class="option" data-choice="once-plus-library" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>소식 한 번 + 서재 (추천)</h3>
      <p>엮는 날 친구 피드에 한 번 뜨고, 그 뒤로는 서재에 놓입니다. 좋아요·댓글은 문장 소식처럼 받습니다.</p>
    </div>
  </div>
  <div class="option" data-choice="library-only" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>서재에만</h3>
      <p>피드에는 뜨지 않아 조용합니다. 친구가 내 서재에 들어와야 만날 수 있습니다.</p>
    </div>
  </div>
</div>
