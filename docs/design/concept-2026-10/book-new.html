<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>책 등록 · Readiary 시안</title><link rel="stylesheet" href="app.css">
<style>
.sbox{display:flex;align-items:center;gap:10px;height:52px;margin-top:18px;border-bottom:1.5px solid var(--ink)}
.sbox svg{width:22px;height:22px;color:var(--sub)}
.sbox input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:500 19px var(--sans);color:var(--ink)}
.res{display:grid;grid-template-columns:56px 1fr;gap:4px 16px;padding:14px 0;border-top:1px solid var(--rule);width:100%;text-align:left;align-items:start}
.res .ph{grid-row:span 3;width:56px;aspect-ratio:2/3;display:grid;place-items:center;text-align:center;font:600 10px/1.3 var(--serif);border-radius:2px;box-shadow:0 8px 16px -8px rgb(0 0 0/.5)}
.res img{grid-row:span 3;width:56px;border-radius:2px;box-shadow:0 8px 16px -8px rgb(0 0 0/.5)}
.res b{font:600 18px/1.4 var(--serif)} .res span{font:500 14px var(--sans);color:var(--sub)}
.res[aria-pressed=true]{box-shadow:inset 3px 0 0 var(--accent);padding-left:14px}
.chosen{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:22px;border-radius:3px;margin-top:22px;align-items:start}
.chosen img,.chosen .ph{width:110px;aspect-ratio:2/3;object-fit:cover;border-radius:2px 4px 4px 2px;box-shadow:0 18px 28px -14px rgb(0 0 0/.55)}
.chosen .ph{display:grid;place-items:center;font:600 16px/1.4 var(--serif);text-align:center;padding:8px}
.panel[hidden]{display:none}
.where{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
@media (min-width:1024px){.bn{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;align-items:start}.chosen{position:sticky;top:44px;margin-top:0}}
</style></head>
<body data-tab="books" class="plain">
<header class="navbar only-mobile"><a class="back" href="books.html"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>책장</a><span class="title">책 등록</span></header>
<main class="page"><div class="wrap" style="max-width:1040px"><div class="top-sentinel"></div>
<h1 class="large-title">책 등록</h1>
<div class="seg2" role="tablist" style="margin-top:16px;max-width:360px"><button role="tab" class="on" data-p="find">찾아서 꽂기</button><button role="tab" data-p="hand">직접 적기</button></div>
<div class="bn">
<div>
  <section class="panel" id="find">
    <label class="sbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="search" value="에로스의 종말" aria-label="제목이나 ISBN"></label>
    <p class="meta" style="margin-top:8px">제목, 지은이, ISBN으로 찾아요.</p>
    <div style="margin-top:14px">
      <button class="res" aria-pressed="true"><div class="ph" style="background:#E9E4DA;color:#3B3A36">에로스의<br>종말</div><b>에로스의 종말</b><span>한병철 · 김태환 옮김</span><span>문학과지성사 · 2015</span></button>
      <button class="res"><div class="ph" style="background:#7A2E2B;color:#F1E6D2">에로스의<br>종말</div><b>에로스의 종말 (개정판)</b><span>한병철</span><span>문학과지성사 · 2024</span></button>
      <button class="res"><div class="ph" style="background:#3E4A6B;color:#EAE6DC">에로스와<br>문명</div><b>에로스와 문명</b><span>허버트 마르쿠제</span><span>나남 · 2004</span></button>
    </div>
  </section>
  <section class="panel" id="hand" hidden>
    <label class="field"><span>제목</span><input placeholder="책 제목"></label>
    <label class="field"><span>지은이</span><input placeholder="선택"></label>
    <label class="field"><span>전체 쪽수</span><input inputmode="numeric" placeholder="선택"><div class="hint">모르면 비워 두세요. 전자책·오디오북도 기록할 수 있어요.</div></label>
    <div class="field"><span>표지 <i class="tag-new">제안</i></span>
      <div style="display:flex;gap:8px;margin-top:10px"><button class="btn line sm press">사진 찍기</button><button class="btn line sm press">앨범에서 고르기</button></div>
      <div class="hint">비워 두면 제목으로 표지를 만들어요.</div></div>
  </section>
</div>
<div class="chosen sheet">
  <div class="ph cph" style="background:#E9E4DA;color:#3B3A36">에로스의<br>종말</div>
  <div>
    <div style="font:600 20px/1.4 var(--serif)">에로스의 종말</div><div class="meta" style="margin-top:4px">한병철</div>
    <label class="field" style="margin-top:12px"><span>전체 쪽수</span><input inputmode="numeric" value="148"><div class="hint">책 정보에서 가져왔어요. 고쳐도 돼요.</div></label>
  </div>
  <div style="grid-column:1/-1">
    <div class="label">어디에 꽂을까요 <i class="tag-new">제안</i></div>
    <div class="where" role="radiogroup"><span class="chip on" role="radio" aria-checked="true">읽는 중</span><span class="chip" role="radio" aria-checked="false">다 읽은 책</span><span class="chip" role="radio" aria-checked="false">읽고 싶은 책</span></div>
    <a class="btn ink press" href="book.html" style="width:100%;margin-top:18px">책장에 꽂기</a>
  </div>
</div>
</div>
</div></main>
<script src="shell.js"></script>
<script>
document.querySelectorAll('.seg2 [data-p]').forEach(b=>b.addEventListener('click',()=>document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==b.dataset.p)));
const rs=[...document.querySelectorAll('.res')];rs.forEach(r=>r.addEventListener('click',()=>{rs.forEach(x=>x.setAttribute('aria-pressed',x===r));const c=document.querySelector('.chosen');const ph=c.querySelector('.cph');ph.style.cssText=r.querySelector('.ph').style.cssText;ph.innerHTML=r.querySelector('.ph').innerHTML;c.querySelector('div>div').textContent=r.querySelector('b').textContent;}));
document.querySelectorAll('.where .chip').forEach(c=>c.addEventListener('click',()=>document.querySelectorAll('.where .chip').forEach(x=>{x.classList.toggle('on',x===c);x.setAttribute('aria-checked',x===c)})));
</script>
</body></html>
