<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>원고지 필사 · Readiary 시안</title><link rel="stylesheet" href="app.css">
<style>
/* 원고지: 그림이 아니라 칸. 한 칸에 한 글자, 띄어쓰기도 한 칸, 줄과 줄 사이엔 좁은 띠 */
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.bookpick{display:inline-flex;align-items:center;gap:6px;font:600 17px var(--sans);height:44px;border-bottom:1.5px solid var(--ink)}
.bookpick svg{width:18px;height:18px}
.pg{font:500 16px var(--sans);color:var(--sub);display:flex;align-items:center;gap:6px}
.pg input{width:56px;height:44px;border:0;border-bottom:1px solid var(--rule);background:transparent;font:500 17px var(--mono);color:var(--ink);outline:0;text-align:center}
.modes{display:flex;gap:8px;margin-top:18px}
.paper{position:relative;margin-top:18px;padding:14px 12px 16px;background:rgb(var(--sheet));border-radius:2px;
  box-shadow:inset 0 0 0 1px rgb(60 45 25/.08),0 14px 30px -22px rgb(60 45 25/.4);cursor:text}
@media (prefers-color-scheme:dark){.paper{box-shadow:inset 0 0 0 1px rgb(255 255 255/.06),0 16px 32px -20px rgb(0 0 0/.7)}}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--c));justify-content:center;row-gap:8px}
.cell{width:var(--c);height:var(--c);display:grid;place-items:center;font:400 calc(var(--c) * .62)/1 var(--serif);color:var(--ink);
  box-shadow:inset -1px 0 0 rgb(var(--gl)/.55),inset 0 -1px 0 rgb(var(--gl)/.55),inset 0 1px 0 rgb(var(--gl)/.55)}
.cell.first{box-shadow:inset 1px 0 0 rgb(var(--gl)/.55),inset -1px 0 0 rgb(var(--gl)/.55),inset 0 -1px 0 rgb(var(--gl)/.55),inset 0 1px 0 rgb(var(--gl)/.55)}
.cell.g{color:var(--faint);opacity:.55}
.cell.miss{color:var(--accent)}
.cell.caret{background:rgb(45 95 184/.08);box-shadow:inset 0 -2px 0 var(--accent),inset -1px 0 0 rgb(var(--gl)/.55),inset 0 1px 0 rgb(var(--gl)/.55)}
:root{--gl:79 102 148}
@media (prefers-color-scheme:dark){:root{--gl:110 135 185}}
.ta{position:absolute;inset:0;opacity:0;resize:none;border:0;font-size:16px;caret-color:transparent;cursor:text}
.cnt{display:flex;justify-content:space-between;margin-top:10px;font:500 13px var(--mono);color:var(--sub)}
.acts{display:flex;gap:8px;margin-top:20px}.acts .ink{margin-left:auto}
.guide{margin-top:14px;padding:12px 14px;border-radius:2px}
.guide .l{font:600 13px var(--sans);color:var(--sub)} .guide .t{font:400 16px/1.55 var(--serif);margin-top:4px}
.guide[hidden]{display:none}
@media (min-width:1024px){.pw{max-width:860px}}
</style></head>
<body data-tab="today" class="plain">
<header class="navbar only-mobile"><a class="back" href="home2.html"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>오늘</a><span class="title">필사</span></header>
<main class="page"><div class="wrap pw"><div class="top-sentinel"></div>
  <h1 class="large-title">원고지에 필사</h1>
  <p class="meta" style="margin-top:6px;line-height:1.5">마음에 든 문장을 한 글자씩 옮겨 써요. 다 쓰면 그대로 문장 기록이 돼요.</p>
  <div class="ph"><button class="bookpick">소유냐 존재냐 <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><label class="pg">쪽 <input inputmode="numeric" value="96" aria-label="쪽"></label></div>
  <div class="modes" role="tablist" aria-label="어떻게 쓸까요"><button class="chip on" role="tab" aria-selected="true" data-m="blank">빈 원고지</button><button class="chip" role="tab" aria-selected="false" data-m="guide">남긴 문장 따라 쓰기</button></div>
  <div class="guide sheet" hidden><div class="l">따라 쓸 문장 · 소유냐 존재냐 p.96</div><div class="t">사랑은 가지는 것이 아니라 하는 것이다.</div></div>
  <div class="paper" id="paper">
    <div class="grid" id="grid" aria-hidden="true"></div>
    <textarea class="ta" id="ta" aria-label="원고지에 옮겨 쓸 문장" autocomplete="off" spellcheck="false"></textarea>
  </div>
  <div class="cnt"><span id="n">0자</span><span id="sheet">200자 원고지 1장</span></div>
  <div class="acts"><button class="btn line sm press" id="clr">지우기</button><button class="btn ink press" data-toast="필사한 문장을 남겼어요">남기기</button></div>
</div></main>
<script src="shell.js"></script>
<script>
const grid=document.getElementById('grid'), ta=document.getElementById('ta'), paper=document.getElementById('paper');
const GUIDE='사랑은 가지는 것이 아니라 하는 것이다.';
let mode='blank';
const dims=()=>{const c=innerWidth<1024?28:40, w=paper.clientWidth-24, cols=Math.max(8,Math.min(20,Math.floor(w/c)));return {c,cols,rows:innerWidth<1024?8:6};};
// 글자를 칸에 놓는다: 줄바꿈은 다음 줄로, 줄 첫 칸에 오는 띄어쓰기는 쓰지 않는다(원고지 규칙)
function place(chars,cols){const out=[];let col=0;for(const ch of chars){if(ch==='\n'){while(col%cols)out.push(null),col++;continue;}
  if(ch===' '&&col%cols===0)continue;out.push(ch);col++;}return out;}
function draw(){const {c,cols,rows}=dims();grid.style.setProperty('--c',c+'px');grid.style.setProperty('--cols',cols);
  const typed=place([...ta.value],cols), guide=mode==='guide'?place([...GUIDE],cols):[];
  const total=Math.max(rows*cols,Math.ceil((Math.max(typed.length,guide.length)+1)/cols)*cols);
  let h='';for(let i=0;i<total;i++){const t=typed[i],g=guide[i];let cls='cell'+(i%cols===0?' first':'');let ch='';
    if(t!=null){ch=t;if(mode==='guide'&&g!=null&&g!==t)cls+=' miss';}else if(g!=null&&i>=typed.length){ch=g;cls+=' g';}
    if(i===typed.length)cls+=' caret';h+=`<span class="${cls}">${ch===' '?'':ch.replace(/</g,'&lt;')}</span>`;}
  grid.innerHTML=h;const n=[...ta.value.replace(/\n/g,'')].length;document.getElementById('n').textContent=n+'자'+(mode==='guide'?` · ${[...GUIDE].length}자 중`:'');
  document.getElementById('sheet').textContent=`200자 원고지 ${Math.max(1,Math.ceil(n/200))}장`;}
ta.addEventListener('input',draw);addEventListener('resize',draw);
paper.addEventListener('click',()=>ta.focus());
document.getElementById('clr').onclick=()=>{ta.value='';draw();ta.focus();};
document.querySelectorAll('.modes .chip').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.m;
  document.querySelectorAll('.modes .chip').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b)});
  document.querySelector('.guide').hidden=mode!=='guide';draw();ta.focus();}));
document.fonts.ready.then(draw);draw();
</script>
</body></html>
