<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>윤서님의 문장 · Readiary</title><link rel="stylesheet" href="app.css">
<style>
.top{display:flex;align-items:center;justify-content:space-between;height:56px}
.top b{font:700 22px var(--serif)}
.sc{max-width:620px;margin:6vh auto 0;padding:34px 30px 26px;border-radius:3px;transform:rotate(-.8deg)}
.sc .who{font:600 15px var(--sans);color:var(--sub)}
.sc .q{font:600 27px/1.65 var(--serif);margin-top:18px;letter-spacing:-.01em}
.sc .src{font:500 15px var(--sans);color:var(--sub);margin-top:18px}
.cta{max-width:620px;margin:44px auto 0;text-align:center}
.cta p{font:400 19px/1.7 var(--serif);color:var(--sub)}
.og{max-width:620px;margin:56px auto 0;padding-top:20px;border-top:1px dashed var(--rule)}
.ogc{display:grid;grid-template-columns:1.9fr 1fr;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule);margin-top:10px}
.ogc .im{aspect-ratio:1.91/1;background:#F4F0E8;color:#221E1A;padding:18px;font:600 15px/1.6 var(--serif);display:flex;flex-direction:column}
.ogc .im small{margin-top:auto;font:500 11px var(--sans);color:#6B645A}
.ogc .tx{padding:14px;font:600 14px var(--sans)} .ogc .tx span{display:block;font:500 12px var(--sans);color:var(--sub);margin-top:4px}
</style></head>
<body data-tab="none" class="plain bare">
<main class="page"><div class="wrap" style="padding-top:calc(12px + env(safe-area-inset-top));max-width:1000px;margin:0 auto">
  <div class="top"><b>Readiary</b><a class="btn line sm press" href="auth.html">로그인</a></div>
  <article class="sc sheet">
    <div class="who">윤서님의 문장 · 10월 6일</div>
    <p class="q">질문을 바꾸면 같은 하루도 다른 얼굴을 한다.</p>
    <div class="src">철학이 깊을수록 삶은 단순하다 · p.42</div>
  </article>
  <div class="cta">
    <p>마음에 남은 문장을 적어 두면,<br>한 달 뒤에도 일 년 뒤에도 다시 만나요.</p>
    <a class="btn ink press" href="auth.html#signup" style="margin-top:18px">Readiary에서 나의 문장 기록하기</a>
  </div>
  <div class="og"><div class="label">메신저에 붙였을 때 보이는 미리보기</div>
    <div class="ogc"><div class="im">질문을 바꾸면 같은 하루도 다른 얼굴을 한다.<small>윤서 · 철학이 깊을수록 삶은 단순하다</small></div><div class="tx">윤서님의 문장<span>readiary.net</span></div></div></div>
</div></main>
<script src="shell.js"></script>
</body></html>
